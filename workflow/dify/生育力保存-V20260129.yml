            3. **新增分型信息**：{{#17694993361120.output#}}\n4. **新增其他实体**：{{#1769499221577.output#}}\n\
            \n### # Task\n对比历史存档与新增信息，按照以下逻辑执行实体的“增、改、留”，并输出最终合并后的全量 JSON 数组。\n\n\
            ### # Rules (强制执行逻辑)\n\n1. **实体比对与更新逻辑**：\n   - **更新 (Update)**：如果“新增信息”中的某个键（Key）在“历史存档”中已存在，且新增信息提供了更具体、更新或更完整的数值，则**覆盖**历史存档的值。\n\
            \   - **新增 (Insert)**：如果“新增信息”中出现了“历史存档”中没有的新键，则将其**添加**到清单中。\n   - **保留\
            \ (Keep)**：如果某个键在“历史存档”中存在，但在本次“新增信息”中未提及，则**保留**历史存档的值，不得删除。\n   - **覆盖优先级**：若多份新增信息对同一实体描述不一，优先级顺序为：**分型信息\
            \ > 分期信息 > 其他实体**。\n\n2. **数据标准化**：\n   - **缺失处理**：所有实体的值（Value）如果为 null、空白或明确标记为未知，必须统一赋值为空：“”。\n\
            \   - **去重**：确保最终数组中每个键（Key）是唯一的。\n\n3. **输出要求**：\n   - **格式**：必须输出一个标准的一维\
            \ JSON 数组，格式为：`[{\"key\": \"实体名称\", \"value\": \"实体值\"}, ...]`。\n   -\
            \ **严禁解释**：输出结果中只允许出现 JSON 数组，严禁包含任何前言、后缀、Markdown 代码块标记或医疗建议。\n\n###\
            \ # Output Example\n```json\n[\n  {\"key\": \"pathology_stage\", \"value\"\
            : \"pT2N1M0 ⅡB期\"},\n  {\"key\": \"ER\", \"value\": \"+ 90%\"},\n  {\"\
            key\": \"LMP_date\", \"value\": \"2023-10-24\"},\n  {\"key\": \"FISH_status\"\
            , \"value\": \"\"}\n]\n```"
