            {{#1754376385431.user_healthy#}}


            **用户本轮输入内容**

            {{#sys.query#}}


            # 处理逻辑

            1. **提取核心诉求**：结合用户的意图、健康状况和具体问题。

            2. **结合身份背景**：将年龄、婚姻状况、性别作为关键约束条件。

