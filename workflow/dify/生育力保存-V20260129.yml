    - data:
        code: "def main(arg1: str) -> dict:\n    import re\n    import json\n    \n\
          \    # 1. 清洗 <think> 标签（DeepSeek R1 的思考过程）\n    pattern = r'<think>.*?</think>'\n\
          \    cleaned = re.sub(pattern, '', arg1, flags=re.DOTALL)\n    cleaned =\
          \ re.sub(r'\\n\\s*\\n', '\\n', cleaned).strip()\n    \n    # 2. 将 JSON 字符串解析为\
          \ Python 字典\n    try:\n        result_obj = json.loads(cleaned)\n      \
          \  \n        # 确保包含三个维度（防止上游输出不完整）\n        if not isinstance(result_obj,\
          \ dict):\n            result_obj = {}\n            \n    except json.JSONDecodeError:\n\
          \        # 如果解析失败（上游不是标准JSON），返回空结构\n        result_obj = {\n          \
