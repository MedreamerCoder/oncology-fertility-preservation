    - data:
        code: "import json\nimport os\n\ndef main(k1, k2, k3):\n    # 1. 容错处理：如果输入是\
          \ None，转为空列表（Dify 有时会传 None 而不是 []）\n    inputs = [k1 or [], k2 or [], k3\
          \ or []]\n    \n    unique_contents = set()  # 用于内容去重\n    result_list =\
          \ []         # 存储最终的结构化数据\n    # 定义需要过滤的标题常量，方便后续维护\n    FILTER_TITLE =\
          \ \"Related content in Knowledge Graph\"\n    \n    # 2. 遍历所有知识库结果\n   \
          \ for data in inputs:\n        # 处理可能的不同数据结构 (可以直接是 list 也可以是 {\"result\"\
          : list})\n        items = []\n        if isinstance(data, list):\n     \
          \       items = data\n        elif isinstance(data, dict):\n           \
          \ items = data.get(\"result\", [])\n            \n        for item in items:\n\
          \            # 安全获取字段并清理空白字符\n            # 安全获取字段并清理空白字符\n            content\
          \ = item.get(\"content\", \"\").strip()\n            title = item.get(\"\
          title\", \"未知来源\").strip()\n\n            # 统一路径分隔符，并只保留真正的文件名\n       \
          \     title = title.replace(\"\\\\\", \"/\").split(\"/\")[-1]\n\n      \
          \      # 过滤指定标题的条目，直接跳过后续处理\n            if title == FILTER_TITLE:\n   \
          \             continue\n\n            # 移除.md/.MD等文件后缀\n            title\
          \ = os.path.splitext(title)[0]\n            \n            # 3. 去重逻辑：仅保留非空且未重复的内容\n\
          \            if content and content not in unique_contents:\n          \
          \      unique_contents.add(content)\n                id_num = len(result_list)\
          \ + 1\n                # 核心修改：拼接成「标题 -数字」格式（如「产品使用手册 -3」）\n            \
          \    display_title = f\"{title} -{id_num}\"\n                # 构建带标识的content\n\
          \                formatted_content = f\"<a href='' data-id='{id_num}' data-type='citation'>{display_title}</a>\\\
          n {content}\"\n                # 构建结构化字典（保留原有id/title字段，避免Dify裁剪）\n    \
          \            result_item = {\n                    \"id\": id_num,\n    \
          \                \"title\": title,  # 原始title不变，仅展示文本加数字标识\n           \
          \         \"content\": formatted_content  # content包含所有关键标记\n          \
          \      }\n                result_list.append(result_item)\n    \n    # 4.\
          \ 空数据处理：返回空列表\n    final_result = result_list\n\n    # 5. 返回结果 (Key 与输出变量一致，值为结构化列表)\n\
          \    return {\n        \"result\": final_result\n    }"
