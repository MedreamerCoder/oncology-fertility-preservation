[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuhub-repro"
version = "0.1.0"
description = "Reproducibility utilities for the YuHub oncofertility study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
yuhub-repro = "yuhub_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
